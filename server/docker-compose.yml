version: '3.8'

services:
  duolink-signaling:
    build: .
    container_name: duolink-signaling
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Coturn STUN/TURN Server for NAT traversal
  coturn:
    image: coturn/coturn:latest
    container_name: duolink-coturn
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DETECT_EXTERNAL_IP=yes
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --lt-cred-mech
      - --realm=duolink.local
      - --user=duolinkuser:SuperSecureTurnPassword2026!

